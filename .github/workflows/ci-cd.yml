name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
  test:
    uses: vidavidorra/.github/.github/workflows/node-test.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
  code-coverage:
    uses: vidavidorra/.github/.github/workflows/node-test-coverage.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
    needs:
      - lint
      - build
      - test
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@691aebe7979c88fe3e0ed011f228b9f881920afa # v8.1.28
    needs:
      - lint-commit-messages
      - lint
      - build
      - test
      - code-coverage
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
