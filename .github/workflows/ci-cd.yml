name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
  test:
    uses: vidavidorra/.github/.github/workflows/node-test.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
  code-coverage:
    uses: vidavidorra/.github/.github/workflows/node-test-coverage.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
    needs:
      - lint
      - build
      - test
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@bc0bcc6dc1f18fa5074fe2e60b549310e9259c5c # v8.1.25
    needs:
      - lint-commit-messages
      - lint
      - build
      - test
      - code-coverage
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
